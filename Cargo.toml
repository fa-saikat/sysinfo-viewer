[package]
name = "sysinfo-viewer"
version = "1.1.0-1"
description = "GUI system information viewer for Linux desktop, built with GPUI. Displays OS/kernel, CPU, memory, network, storage, and GPU details across tabbed views."
edition = "2021"

[dependencies]
anyhow = "1"

# NOTE: point these at whatever your welcome app's Cargo.toml uses — that
# project didn't come with its manifest attached, so these are placeholders.
# If the welcome app pulls gpui/gpui_platform from a git dependency (the Zed
# repo, a vendored fork, a workspace path, etc.) mirror the exact same
# source + rev here so both apps build against one consistent GPUI version.
gpui = { git = "https://github.com/zed-industries/zed" }
# `gpui_linux` panics at startup ("At least one of the wayland or x11
# features must be enabled") unless a backend feature is turned on here.
# Match whatever your welcome app's Cargo.toml already enables — if it
# only ships one of the two, use that one instead of both.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["x11", "wayland"] }

# System info collection.
sysinfo = "0.31"

# Per-interface IP addresses (sysinfo covers name/mac/traffic but not IPs).
if-addrs = "0.10"

[profile.release]
opt-level = 3
lto = true

[package.metadata.deb]
maintainer = "Fahim A Saikat <fahimabrar.saikat@gmail.com>"
copyright = "2026, Fahim A Saikat"
license-file = ["LICENSE", "4"]
extended-description = "GUI system information viewer for Linux desktop, built with GPUI. Displays OS/kernel, CPU, memory, network, storage, and GPU details across tabbed views."
section = "utils"
priority = "optional"
depends = "$auto"
maintainer-scripts = "packaging/DEBIAN"
changelog = "packaging/changelog"
assets = [
    ["target/release/sysinfo-viewer", "usr/bin/", "755"],
    ["assets/sysinfo-viewer.svg", "usr/share/icons/hicolor/256x256/apps/sysinfo-viewer.svg", "644"],
    ["packaging/sysinfo-viewer.desktop", "usr/share/applications/sysinfo-viewer.desktop", "644"],
    ["assets/backgrounds/*", "usr/share/sysinfo-viewer/assets/backgrounds/", "644"],
]
